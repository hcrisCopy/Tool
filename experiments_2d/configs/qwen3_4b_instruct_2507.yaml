paths:
  # Paths are resolved from the repository root, never from the current shell.
  model: ../../Qwen/Qwen3-4B-Instruct-2507
  dataset: ../CallTool_data/When2Tool
  output_root: ../CallTool_data/experiments_2d

model:
  slug: qwen3-4b-instruct-2507
  architecture: Qwen3ForCausalLM
  num_hidden_layers: 36
  hidden_size: 2560
  head_dim: 128
  torch_dtype: bfloat16
  # Matches the pinned official When2Tool commit used by this repository.
  transformers_version: 4.55.2

generation:
  # Reproducible extension of the pinned W2T protocol.  Upstream vLLM 0.8.5
  # leaves seed=None, so its published random stream cannot be replayed exactly.
  # Seed 0 is our preregistered primary; 1/2 are repeat-generation runs.
  seeds: [0, 1, 2]
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  do_sample: true
  # Matches the pinned When2Tool extract_features.py and evaluation defaults.
  max_new_tokens: 2048
  max_rounds: 12
  max_model_len: 32768
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90

# Batch 1 matches the pinned W2T extraction path exactly; no batch-dependent
# BF16 kernel differences are admitted into the strict baseline.
extraction_batch_size: 1

analysis:
  seed: 20260721
  # PDF primary result and a preregistered robustness rerun.
  n_label_shuffles_primary: 200
  n_label_shuffles_robustness: 2000
  n_onset_bootstraps: 500
  n_selection_bootstraps: 500
  n_metric_bootstraps: 10000
  onset_peak_fraction: 0.95
  onset_smoothing_width: 3
  max_onset_window: 5
  stability_frequency: 0.70
  sign_agreement: 0.90
  necessity_top_fraction: 0.005
  necessity_top_cap: 256
  category_top_k: 128
  category_margin: 0.2
  necessity_penalty: 0.5
  n_random_controls: 100
  causal_permutations: 10000
  patch_alphas: [0.5, 1.0, 1.5]
  mask_fractions: [0.25, 0.5, 1.0]

