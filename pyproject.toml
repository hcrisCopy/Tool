[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "when2tool-action"
version = "0.3.0"
description = "Full-menu NONE/A/B/C action analysis and Precise-Shield-style tool-neuron experiments"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["when2tool_action*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
